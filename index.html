<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D game</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    /* 16:9, ~half the page area */
    canvas {
      aspect-ratio: 16 / 9;
      width: min(70vw, calc(70vh * 16 / 9));
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script src="map.js"></script>
  <script src="game.js"></script>
</body>
</html>
